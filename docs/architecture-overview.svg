<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 847" role="img" aria-label="01 · Сеть целиком" style="font-family:system-ui,sans-serif"><defs><marker id="arrow-normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#7489a5"/></marker><marker id="arrow-metadata" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#788ba7"/></marker><marker id="arrow-success" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#63cfa6"/></marker><marker id="arrow-error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f18a9a"/></marker><marker id="arrow-relay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b6a0f7"/></marker><marker id="arrow-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#e4be75"/></marker></defs><rect width="100%" height="100%" fill="#0b1220"/><path d="M180,152 V196 H180 V240" fill="none" stroke="#7489a5" stroke-width="2"  marker-end="url(#arrow-normal)" marker-start="url(#arrow-normal)"/><text x="180" y="188" text-anchor="middle" fill="#7489a5" font-size="11" paint-order="stroke" stroke="#0b1220" stroke-width="5" stroke-linejoin="round">локальный control.sock</text><path d="M180,352 V396 H180 V440" fill="none" stroke="#7489a5" stroke-width="2"  marker-end="url(#arrow-normal)" marker-start="url(#arrow-normal)"/><text x="180" y="388" text-anchor="middle" fill="#7489a5" font-size="11" paint-order="stroke" stroke="#0b1220" stroke-width="5" stroke-linejoin="round">вызовы libp2p</text><path d="M1030,152 V196 H1030 V240" fill="none" stroke="#7489a5" stroke-width="2"  marker-end="url(#arrow-normal)" marker-start="url(#arrow-normal)"/><text x="1030" y="188" text-anchor="middle" fill="#7489a5" font-size="11" paint-order="stroke" stroke="#0b1220" stroke-width="5" stroke-linejoin="round">локальный control.sock</text><path d="M1030,352 V396 H1030 V440" fill="none" stroke="#7489a5" stroke-width="2"  marker-end="url(#arrow-normal)" marker-start="url(#arrow-normal)"/><text x="1030" y="388" text-anchor="middle" fill="#7489a5" font-size="11" paint-order="stroke" stroke="#0b1220" stroke-width="5" stroke-linejoin="round">вызовы libp2p</text><path d="M330,464 H392.5 V236 H455" fill="none" stroke="#788ba7" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-metadata)" marker-start="url(#arrow-metadata)"/><text x="392.5" y="350" text-anchor="middle" fill="#788ba7" font-size="11" paint-order="stroke" stroke="#0b1220" stroke-width="5" stroke-linejoin="round">register / find</text><path d="M880,464 H817.5 V236 H755" fill="none" stroke="#788ba7" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-metadata)" marker-start="url(#arrow-metadata)"/><text x="817.5" y="350" text-anchor="middle" fill="#788ba7" font-size="11" paint-order="stroke" stroke="#0b1220" stroke-width="5" stroke-linejoin="round">register / find</text><path d="M330,496 H880" fill="none" stroke="#63cfa6" stroke-width="2"  marker-end="url(#arrow-success)" marker-start="url(#arrow-success)"/><text x="605" y="486" text-anchor="middle" fill="#63cfa6" font-size="11" paint-order="stroke" stroke="#0b1220" stroke-width="5" stroke-linejoin="round">прямой защищённый канал</text><path d="M180,552 V616 H605 V680" fill="none" stroke="#b6a0f7" stroke-width="2"  marker-end="url(#arrow-relay)" marker-start="url(#arrow-relay)"/><text x="392.5" y="608" text-anchor="middle" fill="#b6a0f7" font-size="11" paint-order="stroke" stroke="#0b1220" stroke-width="5" stroke-linejoin="round">защищённый релейный путь</text><path d="M1030,552 V616 H605 V680" fill="none" stroke="#b6a0f7" stroke-width="2"  marker-end="url(#arrow-relay)" marker-start="url(#arrow-relay)"/><text x="817.5" y="608" text-anchor="middle" fill="#b6a0f7" font-size="11" paint-order="stroke" stroke="#0b1220" stroke-width="5" stroke-linejoin="round">защищённый релейный путь</text><g data-node="a_ui" tabindex="0" role="button" aria-label="Терминал A" style="cursor:pointer"><title>TUI отправляет локальные команды snapshot и send. Он не соединяется с чужим TUI. Основной запуск владеет сетевым узлом; --attach подключает дополнительный интерфейс к уже работающему процессу.</title><rect x="30" y="40" width="300" height="112" rx="14" fill="#142133" stroke="#334b65" stroke-width="2"/><text x="46" y="69" fill="#f0f5fc" font-size="16" font-weight="600">Терминал A</text><text x="46" y="97" fill="#acbdd0" font-size="12">Беседы, ввод, статусы</text><text x="46" y="118" fill="#acbdd0" font-size="12">Linux / macOS / Windows</text><text x="46" y="137" fill="#728aa5" font-size="10">newTerminalUI · main.go:1423</text></g><g data-node="a_core" tabindex="0" role="button" aria-label="Ядро пира A" style="cursor:pointer"><title>Создаёт подписанное сообщение, сохраняет его в state.json, затем пытается доставить. Ключ хранится только у узла. При офлайне B сообщение остаётся у A.</title><rect x="30" y="240" width="300" height="112" rx="14" fill="#142133" stroke="#334b65" stroke-width="2"/><text x="46" y="269" fill="#f0f5fc" font-size="16" font-weight="600">Ядро пира A</text><text x="46" y="297" fill="#acbdd0" font-size="12">Ed25519 · очередь · история</text><text x="46" y="318" fill="#acbdd0" font-size="12">Отправитель за NAT</text><text x="46" y="337" fill="#728aa5" font-size="10">queue · main.go:848</text></g><g data-node="a_net" tabindex="0" role="button" aria-label="libp2p узла A" style="cursor:pointer"><title>libp2p устанавливает аутентифицированные защищённые соединения. У скрытого узла исходящее соединение к публичному узлу обеспечивает путь для релейного подключения.</title><rect x="30" y="440" width="300" height="112" rx="14" fill="#142133" stroke="#6e59ac" stroke-width="2"/><text x="46" y="469" fill="#f0f5fc" font-size="16" font-weight="600">libp2p узла A</text><text x="46" y="497" fill="#acbdd0" font-size="12">WS/WSS · TCP · QUIC</text><text x="46" y="518" fill="#acbdd0" font-size="12">AutoNAT / AutoRelay / DCUtR</text><text x="46" y="537" fill="#728aa5" font-size="10">run · main.go:1706</text></g><g data-node="directory" tabindex="0" role="button" aria-label="Публичный R: каталог" style="cursor:pointer"><title>Каталог возвращает адреса, но не расшифровывает сообщения между A и B. Роль каталога реализована приложением; технически обработчик есть у каждого пира. Пример сервера сейчас слушает WS на 80 и TCP/QUIC на 4002.</title><rect x="455" y="180" width="300" height="112" rx="14" fill="#142133" stroke="#9f7e35" stroke-width="2"/><text x="471" y="209" fill="#f0f5fc" font-size="16" font-weight="600">Публичный R: каталог</text><text x="471" y="237" fill="#acbdd0" font-size="12">Peer ID → подписанные адреса</text><text x="471" y="258" fill="#acbdd0" font-size="12">Пример: 203.0.113.10</text><text x="471" y="277" fill="#728aa5" font-size="10">handleDirectory · main.go:755</text></g><g data-node="relay" tabindex="0" role="button" aria-label="Публичный R: реле" style="cursor:pointer"><title>Это второй сервис того же публичного узла. Реле передаёт защищённое соединение A↔B и не является конечным получателем переписки. Если написать на Peer ID самого R, R уже становится адресатом и читает предназначенное ему сообщение.</title><rect x="455" y="680" width="300" height="112" rx="14" fill="#142133" stroke="#9f7e35" stroke-width="2"/><text x="471" y="709" fill="#f0f5fc" font-size="16" font-weight="600">Публичный R: реле</text><text x="471" y="737" fill="#acbdd0" font-size="12">Circuit Relay v2</text><text x="471" y="758" fill="#acbdd0" font-size="12">Координация прямой связи</text><text x="471" y="777" fill="#728aa5" font-size="10">run · main.go:1706</text></g><g data-node="b_ui" tabindex="0" role="button" aria-label="Терминал B" style="cursor:pointer"><title>У B те же возможности, что у A. Для ответа роли отправителя и получателя меняются. Отдельного типа «только клиент» в программе нет.</title><rect x="880" y="40" width="300" height="112" rx="14" fill="#142133" stroke="#334b65" stroke-width="2"/><text x="896" y="69" fill="#f0f5fc" font-size="16" font-weight="600">Терминал B</text><text x="896" y="97" fill="#acbdd0" font-size="12">Получение и ответ</text><text x="896" y="118" fill="#acbdd0" font-size="12">Свой приватный ключ</text><text x="896" y="137" fill="#728aa5" font-size="10">newTerminalUI · main.go:1423</text></g><g data-node="b_core" tabindex="0" role="button" aria-label="Ядро пира B" style="cursor:pointer"><title>Обработчик проверяет From, To, ID и подпись; ищет уже принятое сообщение с тем же From+ID. Новое сообщение сохраняется до положительного ACK.</title><rect x="880" y="240" width="300" height="112" rx="14" fill="#142133" stroke="#334b65" stroke-width="2"/><text x="896" y="269" fill="#f0f5fc" font-size="16" font-weight="600">Ядро пира B</text><text x="896" y="297" fill="#acbdd0" font-size="12">Проверка подписи и адресата</text><text x="896" y="318" fill="#acbdd0" font-size="12">Сохранение → ACK</text><text x="896" y="337" fill="#728aa5" font-size="10">handleMessage · main.go:806</text></g><g data-node="b_net" tabindex="0" role="button" aria-label="libp2p узла B" style="cursor:pointer"><title>Входящий релейный канал позволяет начать общение и согласовать hole punching. Открытый прямой канал затем используется для новых потоков.</title><rect x="880" y="440" width="300" height="112" rx="14" fill="#142133" stroke="#6e59ac" stroke-width="2"/><text x="896" y="469" fill="#f0f5fc" font-size="16" font-weight="600">libp2p узла B</text><text x="896" y="497" fill="#acbdd0" font-size="12">Прямая связь при возможности</text><text x="896" y="518" fill="#acbdd0" font-size="12">Реле при необходимости</text><text x="896" y="537" fill="#728aa5" font-size="10">run · main.go:1706</text></g></svg>